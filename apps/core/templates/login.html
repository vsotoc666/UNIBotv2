{% extends 'base.html' %}
{% block extra_head %}
<script src="https://unpkg.com/lucide@latest"></script>
<style>nav.bg-\[\#0A1929\] { display: none; }</style>
{% endblock %}

{% block content %}
<div class="min-h-screen flex flex-col justify-center py-12 sm:px-6 lg:px-8 absolute inset-0 bg-slate-50 z-50">
    <div class="sm:mx-auto sm:w-full sm:max-w-md text-center">
        <a href="{% url 'landing' %}" class="inline-flex items-center justify-center mb-4 bg-[#0A1929] p-2 rounded-lg shadow-md hover:bg-[#112a46] transition-colors">
            <i data-lucide="network" class="text-white h-8 w-8"></i>
        </a>
        <h2 class="text-3xl font-extrabold text-[#0A1929] tracking-tight">Bienvenido a UNIBot</h2>
        <p class="text-sm text-slate-500 mt-2">Ingresa a la consola de tu agrupación</p>
    </div>

    <div class="mt-8 sm:mx-auto sm:w-full sm:max-w-md">
        <div class="bg-white py-8 px-4 shadow-xl sm:rounded-2xl sm:px-10 border border-slate-100">
            
            {% if error %}
                <div class="mb-6 flex items-center gap-2 bg-red-50 text-red-700 p-3 rounded-lg text-sm font-semibold border border-red-200">
                    <i data-lucide="alert-circle" class="w-5 h-5"></i>
                    {{ error }}
                </div>
            {% endif %}

            <form action="{% url 'login' %}" method="POST" class="space-y-5">
                {% csrf_token %}
                <div>
                    <label class="block text-sm font-bold text-slate-700 mb-1">Correo Electrónico</label>
                    <input type="email" name="email" required placeholder="correo@agrupacion.uni.edu.pe" class="w-full border border-slate-300 p-3 rounded-xl text-sm outline-none focus:ring-2 focus:ring-[#0A1929] focus:border-transparent transition-all">
                </div>
                <div>
                    <label class="block text-sm font-bold text-slate-700 mb-1">Contraseña</label>
                    <input type="password" name="password" required placeholder="••••••••" class="w-full border border-slate-300 p-3 rounded-xl text-sm outline-none focus:ring-2 focus:ring-[#0A1929] focus:border-transparent transition-all">
                </div>
                
                <button type="submit" class="w-full py-3.5 px-4 rounded-xl font-bold text-white bg-[#0A1929] hover:bg-[#112a46] mt-2 transition-all shadow-md flex justify-center items-center gap-2">
                    <i data-lucide="log-in" class="w-5 h-5"></i>
                    Iniciar Sesión Segura
                </button>
            </form>
            
            <div class="mt-8 text-center text-sm pt-6 border-t border-slate-100">
                <span class="text-slate-500">¿No tienes una cuenta de agrupación?</span>
                <a href="{% url 'register' %}" class="font-bold text-[#0A1929] hover:text-[#BA0C2F] ml-1 transition-colors">Regístrate gratis</a>
            </div>
        </div>
    </div>
</div>
<script>lucide.createIcons();</script>
{% endblock %}
