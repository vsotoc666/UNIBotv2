{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UNIBot | IEEE CIS UNI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        *, body { font-family: 'Inter', sans-serif; }

        /* ══ IEEE CIS Navbar ══ */
        .navbar {
            background: linear-gradient(135deg, #071a38 0%, #003087 100%);
            border-bottom: 1px solid rgba(0,174,239,0.18);
            box-shadow: 0 2px 20px rgba(0,48,135,0.45);
            padding: 0 24px;
            height: 64px;
            display: flex;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 50;
        }
        .navbar-inner {
            width: 100%;
            max-width: 1280px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        /* Logo */
        .nav-logo { display: flex; align-items: center; gap: 10px; text-decoration: none; }
        .nav-logo-img {
            height: 38px;
            width: auto;
            object-fit: contain;
            filter: drop-shadow(0 0 8px rgba(0,174,239,0.5));
            transition: filter 0.2s;
        }
        .nav-logo:hover .nav-logo-img { filter: drop-shadow(0 0 14px rgba(0,174,239,0.8)); }
        .nav-logo-texts { display: flex; flex-direction: column; line-height: 1.1; }
        .nav-logo-title {
            font-size: 1rem;
            font-weight: 800;
            color: #fff;
            letter-spacing: -0.02em;
        }
        .nav-logo-sub {
            font-size: 0.6rem;
            font-weight: 600;
            color: #00aeef;
            letter-spacing: 0.12em;
            text-transform: uppercase;
        }

        /* Divider */
        .nav-divider { width: 1px; height: 22px; background: rgba(0,174,239,0.2); }

        /* User area */
        .nav-user { display: flex; align-items: center; gap: 10px; }
        .nav-avatar {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            background: linear-gradient(135deg, #00aeef, #0057b8);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.72rem;
            font-weight: 800;
            color: #fff;
            letter-spacing: 0.04em;
            border: 2px solid rgba(0,174,239,0.4);
            box-shadow: 0 0 12px rgba(0,174,239,0.3);
            flex-shrink: 0;
        }
        .nav-email {
            font-size: 0.78rem;
            font-weight: 500;
            color: rgba(255,255,255,0.7);
            max-width: 210px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .nav-email strong { color: #fff; font-weight: 700; }
        .nav-logout {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            background: rgba(0,174,239,0.12);
            border: 1px solid rgba(0,174,239,0.35);
            color: #7dd8ff;
            border-radius: 9px;
            padding: 6px 13px;
            font-size: 0.74rem;
            font-weight: 700;
            text-decoration: none;
            transition: all 0.18s;
            letter-spacing: 0.01em;
        }
        .nav-logout:hover {
            background: #00aeef;
            border-color: #00aeef;
            color: #fff;
            box-shadow: 0 3px 12px rgba(0,174,239,0.45);
        }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body class="bg-slate-50 text-slate-800">

    <nav class="navbar">
        <div class="navbar-inner">

            <!-- Logo IEEE CIS -->
            <a href="/" class="nav-logo">
                <img src="{% static 'logo_cis.png' %}" alt="IEEE CIS UNI" class="nav-logo-img"
                     onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">
                <!-- Fallback SVG si no carga el logo -->
                <div style="display:none;width:36px;height:36px;background:linear-gradient(135deg,#00aeef,#003087);border-radius:10px;align-items:center;justify-content:center;box-shadow:0 0 12px rgba(0,174,239,0.5);">
                    <svg width="22" height="22" viewBox="0 0 50 50" fill="white">
                        <circle cx="34" cy="14" r="11"/>
                        <path d="M10 42 C10 29 20 21 29 23 C37 25 40 33 38 41" stroke="white" stroke-width="9" stroke-linecap="round" fill="none"/>
                    </svg>
                </div>
                <div class="nav-logo-texts">
                    <span class="nav-logo-title">UNIBot</span>
                    <span class="nav-logo-sub">IEEE CIS UNI</span>
                </div>
            </a>

            <!-- Right -->
            <div class="nav-user">
                {% if user.is_authenticated %}
                    <div class="nav-avatar">{{ user.email|slice:":2"|upper }}</div>
                    <div class="nav-divider"></div>
                    <span class="nav-email"><strong>{{ user.email|truncatechars:30 }}</strong></span>
                    <div class="nav-divider"></div>
                    <a href="{% url 'logout' %}" class="nav-logout">
                        <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none"
                             stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/>
                        </svg>
                        Salir
                    </a>
                {% else %}
                    <a href="{% url 'landing' %}" class="nav-logout">Inicio</a>
                {% endif %}
            </div>

        </div>
    </nav>

    <main class="container mx-auto p-4 mt-6">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
